workflows:
  build-turath-tweak:
    name: Build Turath Store jailbreak tweak
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install Theos and build rootless package
        script: |
          set -euo pipefail
          brew install ldid dpkg
          export THEOS="$HOME/theos"
          git clone --depth 1 https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          make package FINALPACKAGE=1
    artifacts:
      - packages/*.deb
      - .theos/obj/**/*.dylib
