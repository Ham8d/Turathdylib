workflows:
  build-turath-tweak:
    name: Build Turath Store jailbreak tweak
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install Theos, build package, and export dylib
        script: |
          set -euo pipefail
          brew install ldid dpkg
          export THEOS="$HOME/theos-ci"
          if [ -d "$THEOS/.git" ]; then
            git -C "$THEOS" submodule update --init --recursive
          else
            git clone --depth 1 --recurse-submodules https://github.com/theos/theos.git "$THEOS"
          fi
          make package FINALPACKAGE=1
          PACKAGE_PATH="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$PACKAGE_PATH"
          mkdir -p output/extracted
          dpkg-deb -x "$PACKAGE_PATH" output/extracted
          DYLIB_PATH="$(find output/extracted -type f -name 'TurathStore.dylib' -print -quit)"
          test -n "$DYLIB_PATH"
          cp "$DYLIB_PATH" output/TurathStore.dylib
          file output/TurathStore.dylib
    artifacts:
      - packages/*.deb
      - output/TurathStore.dylib
      - .theos/obj/**/*.dylib
